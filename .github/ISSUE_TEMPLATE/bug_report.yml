name: Bug report
description: Something in the client does not behave as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you file this: if the problem is that a PlanVortex **endpoint** answers something
        unexpected, that is a question for support, not for the client. This is for the package.
  - type: input
    id: version
    attributes:
      label: planvortex version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12.7"
    validations:
      required: true
  - type: dropdown
    id: flavour
    attributes:
      label: Which client
      options:
        - PlanVortex (synchronous)
        - AsyncPlanVortex (asynchronous)
        - Both
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: A way to reproduce it
      description: |
        The smallest snippet that shows it. **Do not paste your `client_secret`, your tokens or
        any real identifier** — replace them.
      render: python
